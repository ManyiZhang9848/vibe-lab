<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2E1065" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="必吃榜·巴厘岛" />
<meta name="format-detection" content="telephone=no" />
<title>必吃榜 · 巴厘岛</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#F6F3FC;color:#1E1B2E;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
:root{
  --brand:#7C3AED;--brand2:#8B5CF6;--deep:#2E1065;--score:#9333EA;--ok:#0D9488;
  --ink:#1E1B2E;--ink2:#4C4460;--ink3:#877FA3;
  --card:#FFFFFF;--line:#E9E3F5;--bg:#F6F3FC;--soft:#F2EBFE;
  --sh:0 2px 10px rgba(30,27,46,.06);
  --sh2:0 8px 28px rgba(30,27,46,.15);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
button{font-family:inherit;border:0;background:none;color:inherit;padding:0;cursor:pointer}
input{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding-bottom:calc(78px + var(--safe-b));min-height:100%}

/* ============ 头部 ============ */
.hdr{
  position:relative;z-index:30;
  background:linear-gradient(140deg,#2E1065 0%,#5B21B6 52%,#7C3AED 100%);
  padding:calc(10px + var(--safe-t)) 16px 14px;
  border-radius:0 0 24px 24px;box-shadow:0 6px 22px rgba(46,16,101,.30);
}
.hdr-top{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.logo{width:30px;height:30px;flex:0 0 30px}
.brand{font-size:19px;font-weight:800;letter-spacing:.5px;color:#fff}
.brand small{display:block;font-size:10.5px;font-weight:500;opacity:.82;letter-spacing:0;margin-top:-1px}
.badge-off{
  margin-left:auto;font-size:10px;padding:3px 8px;border-radius:20px;
  background:rgba(255,255,255,.2);color:#fff;font-weight:600;
  display:flex;align-items:center;gap:4px;backdrop-filter:blur(4px);
}
.dot{width:6px;height:6px;border-radius:50%;background:#5EEAD4;box-shadow:0 0 0 3px rgba(94,234,212,.28)}
/* 纯中文模式：英文层整体隐藏（英文始终是独立元素，靠 CSS 就能干净地摘掉） */
body.lang-zh .en,body.lang-zh .en-i,body.lang-zh .en-s{display:none!important}
.langbtn{
  flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.2px;
  padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.96);
  color:#6D28D9;border:0;box-shadow:0 2px 7px rgba(46,16,101,.18);cursor:pointer;
}
.langbtn:active{transform:scale(.94)}.dot.off{background:#FFD166;box-shadow:0 0 0 3px rgba(255,209,102,.25)}
.locbar{display:flex;gap:8px;align-items:stretch}
.loc-chip{
  flex:1;min-width:0;background:rgba(255,255,255,.96);border-radius:14px;
  padding:9px 12px;display:flex;align-items:center;gap:8px;text-align:left;
  box-shadow:0 3px 10px rgba(46,16,101,.16);
}
.loc-chip .pin{flex:0 0 16px}
.loc-chip .txt{min-width:0;flex:1}
.loc-chip .cur{font-size:11px;color:var(--brand);font-weight:700;line-height:1.2}
.loc-chip .name{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-chip .arrow{flex:0 0 14px;opacity:.45}
.gps{
  flex:0 0 46px;border-radius:14px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:10px;flex-direction:column;gap:2px;font-weight:600;
  border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(4px);
}
.gps:active{background:rgba(255,255,255,.34)}
.gps.loading svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hdr-sub{margin-top:9px;font-size:11.5px;color:rgba(255,255,255,.9);display:flex;align-items:center;gap:6px}
.hdr-sub b{font-weight:700}

/* ============ 筛选条 ============ */
.chips{
  position:sticky;top:0;z-index:29;background:rgba(246,243,252,.94);
  backdrop-filter:blur(10px);padding:10px 0 8px;
  border-bottom:1px solid var(--line);
}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:6px 13px;border-radius:20px;font-size:12.5px;
  background:#fff;color:var(--ink2);border:1px solid var(--line);font-weight:600;
  transition:transform .15s,background .2s,color .2s;
}
.chip:active{transform:scale(.94)}
.chip.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(124,58,237,.28)}
/* 以落脚点为圆心的半径层 */
.ringrow{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.ringlb{flex:0 0 auto;align-self:center;font-size:11px;font-weight:700;color:var(--ink3);white-space:nowrap;padding-right:2px}
.rchip{padding:5px 11px;font-size:12px}
.rchip.on{background:var(--deep);box-shadow:0 3px 10px rgba(46,16,101,.26)}

/* ============ 榜单 ============ */
/* ============ 榜单底部：便利店 / 超市 / 外卖 左右滑 ============ */
.swwrap{margin:16px 0 2px}
.swtabs{display:flex;align-items:center;gap:7px;padding:0 16px 9px;overflow-x:auto;scrollbar-width:none}
.swtabs::-webkit-scrollbar{display:none}
.swtab{
  flex:0 0 auto;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:20px;
  background:#fff;color:var(--ink2);border:1px solid var(--line);box-shadow:var(--sh);
  transition:background .2s,color .2s,transform .15s;
}
.swtab:active{transform:scale(.94)}
.swtab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(124,58,237,.28)}
.swhint{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#B0A8C6;white-space:nowrap;letter-spacing:.3px}
.swpg{flex:0 0 auto;margin-left:auto;font-size:10.5px;font-weight:800;color:#877FA3;font-variant-numeric:tabular-nums;min-width:26px;text-align:center}
.swarrow{
  flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--line);
  color:#6D28D9;font-size:16px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh);transition:transform .15s,opacity .2s;
}
.swarrow:active{transform:scale(.9)}
.swarrow:disabled{opacity:.32;box-shadow:none}
.swfoot{font-size:10.5px;font-weight:700;color:#B0A8C6;text-align:center;padding:7px 0 2px;letter-spacing:.2px}
.swslider{cursor:grab}
.swslider.dragging{cursor:grabbing}
.swslider{
  position:relative;touch-action:pan-x pan-y;
  display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;scrollbar-width:none;
}
.swslider::-webkit-scrollbar{display:none}
.swslider::after{content:"";position:sticky;right:0;top:0;bottom:0;flex:0 0 34px;margin-left:-34px;pointer-events:none;background:linear-gradient(to right,rgba(246,243,252,0),#F6F3FC 78%);z-index:2}
/* pane 复用 .trip 的行内样式（.box / .sec 都挂在 .trip 下），只覆盖内边距 */
.swpane{flex:0 0 96%;scroll-snap-align:start;padding:0 6px 6px 16px}
.swpane.p0{padding-left:0;padding-right:6px}
.srow{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.sbadges{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.sbadge{
  width:30px;height:30px;border-radius:9px;color:#fff;font-size:11.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;letter-spacing:.2px;
  box-shadow:0 2px 6px rgba(30,27,46,.18);
}
.slogo{display:block;height:30px;width:auto;max-width:88px;object-fit:contain;border-radius:4px;flex:0 0 auto}
.slogobar{display:flex;align-items:center;gap:10px;margin:7px 0 3px}
.slogobar .slogo{height:34px;max-width:100px}
.slogoname{font-size:12px;font-weight:800;color:var(--ink);line-height:1.3}
.slogod{font-size:11px;color:var(--ink3);line-height:1.45;margin-top:1px}
.sb{flex:1;min-width:0}
.sbn{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sbd{font-size:11.5px;color:var(--ink3);line-height:1.55;margin-top:2px}
.srole{font-size:11.5px;color:var(--ink2);line-height:1.55;margin-top:4px}
.sbuy{font-size:11.5px;color:var(--ink2);line-height:1.55;margin-top:3px}
.tier{flex:0 0 auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;white-space:nowrap}
.tier.t1{background:#E7F7F3;color:#0D9488}
.tier.t2{background:#FBF1DE;color:#9A6A28}
.tier.t3{background:#FCE7EC;color:#BE123C}

.sec-title{display:flex;align-items:baseline;gap:8px;padding:14px 18px 8px}
.sec-title h2{margin:0;font-size:16px;font-weight:800}
.sec-title span{font-size:11.5px;color:var(--ink3)}
.list{padding:0 12px;display:flex;flex-direction:column;gap:11px}
.card{
  background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:var(--sh);
  border:1px solid rgba(233,227,245,.9);
  animation:rise .38s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.c-top{display:flex;gap:11px;align-items:flex-start}
.rank{
  flex:0 0 30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;background:#C3BAD8;font-family:ui-rounded,system-ui;
}
.rank.r1{background:linear-gradient(135deg,#4C1D95,#7C3AED);box-shadow:0 3px 9px rgba(76,29,149,.34)}
.rank.r2{background:linear-gradient(135deg,#7C3AED,#8B5CF6)}
.rank.r3{background:linear-gradient(135deg,#9333EA,#8B5CF6)}
.c-main{flex:1;min-width:0}
.c-name{font-size:16.5px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.c-name .idn{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:0}
.tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--soft);color:#6D28D9;font-weight:600}
.tag.f{background:#EFE8FB;color:#7C3AED}
.tag.pk1{background:#FFF6E8;color:#9A6A28}
.tag.pk0{background:#E7F6F3;color:#0D9488}
.tag.pk2{background:#EFEDF5;color:#635C79}
.tag.sf0{background:#E7F6F3;color:#0D9488}
.tag.sf1{background:#FFF6E8;color:#9A6A28}
.tag.sf2{background:#FFE4E6;color:#BE123C}
.heat{margin-top:8px;display:flex;align-items:center;gap:7px}
.heat .bar{flex:1;height:4px;border-radius:4px;background:#EDE8F7;overflow:hidden}
.heat .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#C084FC,#7C3AED)}
.heat .num{font-size:10.5px;color:var(--brand);font-weight:800;font-family:ui-rounded,system-ui}
.c-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.price{font-size:10px;color:var(--ink3);font-weight:700;text-align:right;line-height:1.35}
.price b{display:block;color:var(--brand);font-size:12.5px;font-family:ui-rounded,system-ui;letter-spacing:-.2px}
.price small{display:block;color:var(--ink3);font-size:10px;font-weight:700}
.fav-btn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F2EDFD}
.fav-btn:active{transform:scale(.9)}
.c-note{margin-top:8px;font-size:11.5px;color:var(--ink2);line-height:1.6;background:#F9F7FE;border-radius:9px;padding:7px 9px}
/* 菜品卡顶部的食物图（AI 生成示意插画，base64 内嵌；负 margin 顶满卡片圆角） */
.card .hero{margin:-13px -14px 11px;border-radius:18px 18px 0 0;height:186px;overflow:hidden;background:#EDE7F7}
.card .hero img{width:100%;height:100%;object-fit:cover;display:block}
.phero{margin:8px 2px 0;border-radius:16px;overflow:hidden;background:#EDE7F7;box-shadow:0 6px 16px rgba(30,27,46,.10)}
.phero img{width:100%;height:186px;object-fit:cover;display:block}
.pcap{font-size:10px;color:#877FA3;line-height:1.55;margin:6px 4px 0}
.safbar{margin-top:8px;font-size:11.5px;line-height:1.62;border-radius:9px;padding:8px 10px 9px;border-left:3px solid #ccc}
.safbar b{display:block;margin-bottom:2px;font-weight:800;font-size:11px;letter-spacing:.3px}
.safbar .when{display:block;margin-top:5px;font-weight:700}
.safbar.sf1{background:#FFF9EF;border-left-color:#E0A33E;color:#7A5320}
.safbar.sf2{background:#FFF0F3;border-left-color:#BE123C;color:#8C1230}
.safbar summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;gap:8px;user-select:none;-webkit-tap-highlight-color:transparent}
.safbar summary::-webkit-details-marker{display:none}
.safbar summary::marker{content:none}
.safbar summary b{flex:0 0 auto}
.safbar .safsum{flex:1;min-width:0;opacity:.92;line-height:1.62}
.safbar .safcta{flex:0 0 auto;font-size:10.5px;font-weight:800;opacity:.85;padding:1px 7px;border-radius:6px;background:rgba(255,255,255,.55)}
.safbar .safbody{margin-top:7px}
.head{position:relative}
.head summary{list-style:none;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:8px}
.head summary::-webkit-details-marker{display:none}
.head summary::marker{content:none}
.head summary b{flex:1;min-width:0}
.head summary .headcta{flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--brand);padding:1px 8px;border-radius:6px;background:var(--soft)}
.head .headbody{margin-top:8px}
.jumpbar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.jumpbar button{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:18px;background:#fff;color:var(--ink2);border:1px solid var(--line);box-shadow:var(--sh)}
.jumpbar button:active{transform:scale(.94)}
.totop{position:fixed;right:14px;bottom:calc(92px + var(--safe-b));width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(124,58,237,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.totop.show{opacity:1;pointer-events:auto}
.shops{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px;display:flex;flex-direction:column;gap:9px}
.shop{display:flex;align-items:flex-start;gap:9px}
.shop .info{flex:1;min-width:0}
.shop .sn{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop .sa{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.5}
.sa .dist{font-style:normal;display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:5px;background:#F2EBFE;color:#6D28D9}
.sa .dist.b0{background:#D9CDF9;color:#4C1D95}
.sa .dist.b1{background:#E9E1FC;color:#5B21B6}
.sa .dist.b2{background:#F5F1FE;color:#7C3AED}
.sa .dist.b3{background:#EFEDF5;color:#635C79}
.shop .stip{font-size:10.5px;color:#6D28D9;background:#F5F0FE;border-radius:6px;padding:2px 6px;margin-top:4px;display:inline-block;line-height:1.5}
.nav-btn{
  flex:0 0 auto;font-size:11.5px;font-weight:700;color:#fff;padding:6px 11px;border-radius:9px;
  background:linear-gradient(135deg,#8B5CF6,#7C3AED);display:flex;align-items:center;gap:4px;
}
.nav-btn:active{transform:scale(.94)}
.more{font-size:12px;color:var(--brand);font-weight:700;text-align:center;padding:6px 0 2px;width:100%}
.empty{text-align:center;padding:56px 30px;color:var(--ink3)}
.empty .big{font-size:15px;color:var(--ink2);font-weight:700;margin-bottom:6px}
.empty .sm{font-size:12.5px;line-height:1.7}
.tip{margin:6px 14px 0;padding:11px 13px;border-radius:14px;background:#F4F0FE;border:1px dashed #CFC0F7;font-size:11.5px;color:#6D28D9;line-height:1.65}

/* ============ 小吃速查卡 ============ */
.snack{margin:4px 12px 0;background:#fff;border-radius:16px;padding:13px 14px;box-shadow:var(--sh);border:1px solid rgba(233,227,245,.9)}
.snack h4{margin:0 0 9px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.snk{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.snk:last-child{border-bottom:0}
.snk .n{font-weight:700;color:var(--ink);flex:0 0 auto;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snk .d{flex:1;color:var(--ink3);font-size:11px;line-height:1.5}
.snk .p{flex:0 0 auto;color:var(--brand);font-weight:800;font-family:ui-rounded,system-ui;font-size:11.5px}
.eatcard{margin-top:9px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.eatcard:first-child{margin-top:8px}
.eathead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.eatname{font-size:13px;font-weight:800;color:var(--ink)}
.eatrate{font-size:12px;font-weight:800;color:#E8920C;white-space:nowrap;flex:0 0 auto}
.eatmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.eattag{font-size:10.5px;font-weight:700;color:var(--brand);background:#F1EBFD;padding:2px 8px;border-radius:9px}
.eatbadge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:9px}
.eatbadge.hw{background:#FCE7EC;color:#BE123C}
.eatbadge.ok{background:#E7F7F3;color:#0D9488}
.eatprice{font-size:11.5px;color:var(--ink2);font-weight:700;margin-top:6px}
.eatenv{font-size:11px;color:var(--ink3);line-height:1.55;margin-top:4px}
.eatdish{font-size:11px;color:var(--ink2);line-height:1.55;margin-top:5px}
.eatlink{color:var(--brand);font-weight:800;cursor:pointer}

/* ============ 底栏 ============ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);
  display:flex;max-width:520px;margin:0 auto;
}
.tab{flex:1;padding:8px 0 7px;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10.5px;font-weight:600}
.tab.on{color:var(--brand)}
.tab .ic{width:22px;height:22px}
.tab .icw{position:relative;display:flex;align-items:center;justify-content:center}
.tab .cnt{position:absolute;top:-5px;left:12px;background:var(--brand);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}

/* ============ 弹层 ============ */
.mask{position:fixed;inset:0;background:rgba(24,14,46,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;
  border-radius:22px 22px 0 0;transform:translateY(102%);
  transition:transform .32s cubic-bezier(.2,.85,.3,1);
  max-height:88vh;display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;box-shadow:0 -8px 30px rgba(30,27,46,.22);
}
.sheet.on{transform:translateY(0)}
.sh-head{padding:12px 18px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}

  }
  return out;
}

/* 只有真正收录了门店的片区才进「只看某区域」选择器与搜索结果，
   否则点进去是空列表（片区坐标保留，供距离计算用） */
const AREA_WITH_SHOPS = (function(){
  const m = {};
  DISHES.forEach(function(d){ d.shops.forEach(function(s){ m[s[1]] = (m[s[1]] || 0) + 1; }); });
  return m;
})();
function hasShops(a){ return (AREA_WITH_SHOPS[a] || 0) > 0; }

/* 从任意坐标出发，最近的几个「有门店」片区（行程页住处卡用，避免把距离写死在文案里） */
function areasNear(ll, n){
  return Object.keys(AREA)
    .filter(hasShops)
    .map(function(a){ return {a:a, km:haversine(ll, AREA[a])}; })
    .sort(function(x,y){ return x.km - y.km; })
    .slice(0, n || 3);
}

/* ================= 工具 ================= */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]); }); }
function hash(s){ let h=2166136261; s=String(s); for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }

function idrText(n){ return "Rp " + Number(n).toLocaleString("en-US"); }
function cnyText(n){
  const v = Number(n)/IDR_PER_CNY;
  return "¥" + (v >= 10 ? Math.round(v) : (Math.round(v*10)/10));
}
function haversine(a, b){
  const R = 6371, rad = Math.PI/180;
  const dLat = (b[0]-a[0])*rad, dLng = (b[1]-a[1])*rad;
  const la1 = a[0]*rad, la2 = b[0]*rad;
  const h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.min(1, Math.sqrt(h)));
}
function hubOf(k){
  for(let i=0;i<HUBS.length;i++){ if(HUBS[i].k === k) return HUBS[i]; }
  return HUBS[0];
}
function areaLL(a){ return AREA[a] || null; }
function kmFromHub(area){
  const ll = areaLL(area); if(!ll) return null;
  return haversine(hubOf(state.hub).ll, ll);
}
function ringMax(key){
  const k = key || state.ring;
  for(let i=0;i<RING_STEPS.length;i++){ if(RING_STEPS[i].k === k) return RING_STEPS[i].max; }
  return Infinity;
}
function withinRing(km, key){ return km == null ? true : km <= ringMax(key); }
function ringText(km){
  if(km == null) return "—";
  if(km < 0.2) return "同区";
  if(km < 1) return "步行 " + Math.round(km*1000/50)*50 + "m";
  if(km < 10) return "约 " + (Math.round(km*10)/10) + "km";
  return "约 " + Math.round(km) + "km";
}
function ringBand(km){ return km == null ? -1 : (km <= 1 ? 0 : (km <= 5 ? 1 : (km <= 15 ? 2 : 3))); }

/* 距当前落脚点最近、且确实收录了门店的片区（用于空状态给出下一步） */
function nearestAreas(n){
  const h = hubOf(state.hub);
  return Object.keys(AREA_WITH_SHOPS)
    .map(function(a){ return { a:a, km: (AREA[a] ? haversine(h.ll, AREA[a]) : null) }; })
    .filter(function(x){ return x.km != null; })
    .sort(function(x, y){ return x.km - y.km; })
    .slice(0, n || 3);
}

function save(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      hub:state.hub, dist:state.dist, flavor:state.flavor, ring:state.ring, tab:state.tab, mtab:state.mtab, favs:state.favs, lang:state.lang
    }));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY); if(!raw) return;
    const o = JSON.parse(raw);
    if(o.hub) state.hub = o.hub;
    if(o.dist) state.dist = o.dist;
    if(o.flavor) state.flavor = o.flavor;
    if(o.ring) state.ring = o.ring;
    if(o.tab) state.tab = o.tab;
    if(["list","mart","market","delivery"].indexOf(o.mtab) >= 0) state.mtab = o.mtab;
    if(Array.isArray(o.favs)) state.favs = o.favs;
    if(o.lang === "zh" || o.lang === "bi") state.lang = o.lang;    if(Array.isArray(o.favs)) state.favs = o.favs;
  }catch(e){}
}

/* ================= 榜单计算 ================= */
function dishRows(){
  return DISHES.map(function(d, i){
    const shops = d.shops.map(function(s){
      return { nm:s[0], d:s[1], a:s[2], tip:s[3], km:kmFromHub(s[1]) };
    }).sort(function(a,b){
      const ka = a.km == null ? 9999 : a.km, kb = b.km == null ? 9999 : b.km;
      return ka - kb;
    });
    const near = shops.length ? (shops[0].km == null ? 9999 : shops[0].km) : 9999;
    return { n:d.n, idn:d.idn, f:d.f, pk:d.pk, p:d.p, pr:d.pr, note:d.note, base:i, shops:shops, near:near };
  });
}
function currentList(ov){
  // ov 可选：用另一套筛选参数试算，用来判断「筛空」到底是谁造成的
  const ring = (ov && "ring" in ov) ? ov.ring : state.ring;
  const dist = (ov && "dist" in ov) ? ov.dist : state.dist;
  const flavor = (ov && "flavor" in ov) ? ov.flavor : state.flavor;
  let arr = dishRows();

  // 半径过滤：只保留该半径内有店的菜
  if(ring !== "all"){
    arr = arr.filter(function(d){ return d.shops.some(function(s){ return withinRing(s.km, ring); }); });
  }
  // 区域过滤
  if(dist){
    arr = arr.filter(function(d){ return d.shops.some(function(s){ return s.d === dist; }); });
  }
  // 排序：选了半径/区域 → 按「最近那家」由近到远；否则按必吃排序
  if(ring !== "all" || dist){
    arr.sort(function(a,b){
      const da = (dist && a.shops.some(function(s){ return s.d === dist; })) ? 0 : 1;
      const db = (dist && b.shops.some(function(s){ return s.d === dist; })) ? 0 : 1;
      if(da !== db) return da - db;
      if(a.near !== b.near) return a.near - b.near;
      return a.base - b.base;
    });
  }
  if(flavor !== "全部") arr = arr.filter(function(d){ return d.f.indexOf(flavor) >= 0; });
  return arr.slice(0, 10);
}
/* 筛空时判断主因：口味 / 区域 / 半径 —— 三种原因的下一步动作完全不同 */
function emptyCause(){
  if(state.flavor !== "全部" && currentList({ flavor:"全部" }).length) return "flavor";
  if(state.dist && currentList({ dist:"" }).length) return "dist";
  return "ring";
}
function shopsOf(d){
  if(state.ring === "all") return d.shops;
  const inR = d.shops.filter(function(s){ return withinRing(s.km); });
  return inR.length ? inR : d.shops.slice(0,1);
}
function heatOf(d){ return Math.max(42, 99 - d.base*6); }
function favKeyDish(d){ return "D|" + d.n; }
function favKeyShop(dishNm, shopNm){ return "S|" + dishNm + "|" + shopNm; }
function isFav(k){ return state.favs.some(function(f){ return f.k === k; }); }
function toggleFav(item){
  const i = state.favs.map(function(f){ return f.k; }).indexOf(item.k);
  if(i >= 0){ state.favs.splice(i,1); toast("已从收藏移除", "Removed from saved"); }
  else { state.favs.push(item); toast("已收藏", "Saved"); }
  save(); render();
}

function swPane(i){
  const sl = $("#swSlider"); if(!sl) return null;
  return sl.querySelectorAll(".swpane")[i] || null;
}
/* 限高到一屏：四屏高度一致，各屏内容在自己内部上下滚，切屏时整页不跳 */
function swFit(){
  // 榜单整页滚动：不再限高，容器自然撑开，body 整页滚（消除双层滚动）
  const sl = $("#swSlider"); if(!sl) return;
  sl.style.height = "";
  const ps = sl.querySelectorAll(".swpane");
  for(let i = 0; i < ps.length; i++) ps[i].style.height = "";
}
function swLeft(i){
  const p = swPane(i);
  return p ? p.offsetLeft : 0;
}
function swStep(){
  const p = swPane(0);
  const w = p ? p.offsetWidth : 0;
  return w > 0 ? w : 1;
}
function swGoto(i, smooth){
  const sl = $("#swSlider"); if(!sl) return;
  sl.__lock = 1;
  const left = swLeft(i);
  try{ sl.scrollTo({ left: left, behavior: smooth ? "smooth" : "auto" }); }
  catch(e){ sl.scrollLeft = left; }
  setTimeout(function(){ sl.__lock = 0; }, smooth ? 460 : 80);
  // 整页滚：切屏后回到 slider 顶部，让新屏从顶部开始看
  const t = sl.getBoundingClientRect().top + window.scrollY;
  if(window.scrollY > t + 4) window.scrollTo(0, t - 4);
}
function swMark(){
  const bs = document.querySelectorAll("#swTabs .swtab");
  for(let i = 0; i < bs.length; i++){ bs[i].classList.toggle("on", bs[i].dataset.sw === state.mtab); }
  const i = SW_KEYS.indexOf(state.mtab);
  const pg = document.getElementById("swPg");
  if(pg) pg.textContent = (i + 1) + "/" + SW_KEYS.length;
  const pv = document.querySelector('[data-swpx="-1"]'), nx = document.querySelector('[data-swpx="1"]');
  if(pv) pv.disabled = (i <= 0);
  if(nx) nx.disabled = (i >= SW_KEYS.length - 1);
}
function setSwTab(k, smooth){
  if(SW_KEYS.indexOf(k) < 0) return;
  state.mtab = k; save(); swMark();
  swGoto(SW_KEYS.indexOf(k), !!smooth);
  swFit();
}
function swDragBind(sl){
  let down = false, startX = 0, startLeft = 0, moved = false, lastX = 0;
  sl.addEventListener("pointerdown", function(e){
    if(e.pointerType === "touch") return;
    if(e.target.closest("a,button")) return;
    down = true; moved = false; startX = e.clientX; lastX = e.clientX; startLeft = sl.scrollLeft;
    sl.style.scrollSnapType = "none";
    sl.classList.add("dragging");
  });
  sl.addEventListener("pointermove", function(e){
    if(!down) return;
    lastX = e.clientX;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 4){ moved = true; e.preventDefault(); }
    sl.scrollLeft = startLeft - dx;
  });
  function end(){
    if(!down) return;
    down = false;
    sl.style.scrollSnapType = "";
    sl.classList.remove("dragging");
    if(!moved) return;
    const dx = lastX - startX;
    const cur = SW_KEYS.indexOf(state.mtab);
    let i = cur;
    if(dx < -30) i = Math.min(SW_KEYS.length - 1, cur + 1);
    else if(dx > 30) i = Math.max(0, cur - 1);
    state.mtab = SW_KEYS[i]; save(); swMark(); swGoto(i, false); swFit();
  }
  sl.addEventListener("pointerup", end);
  sl.addEventListener("pointerleave", end);
  sl.addEventListener("pointercancel", end);
}
function swInit(){
  const sl = $("#swSlider"); if(!sl) return;
  sl.__lock = 1;
  sl.scrollLeft = swLeft(SW_KEYS.indexOf(state.mtab));
  setTimeout(function(){ sl.__lock = 0; }, 90);
  swFit();
  swMark();
  if(sl.__bound) return;
  sl.__bound = 1;
  swDragBind(sl);
  sl.addEventListener("scroll", function(){
    if(sl.__lock) return;
    clearTimeout(sl.__t);
    sl.__t = setTimeout(function(){
      const w = swStep();
      const i = Math.round(sl.scrollLeft / w);
      const k = SW_KEYS[i];
      if(k && k !== state.mtab){ state.mtab = k; save(); swMark(); swFit(); }
    }, 110);
  });
}
window.addEventListener("resize", function(){ swFit(); });

    '<div class="box" style="margin-top:10px">' +
      '<b>① → ② 乌布换水明漾（9/29）</b>　包车单程 Rp 350–600k（¥132–226）；Grab / Gojek 汽车 Rp 150–250k（¥57–94），但<b>乌布中心（Monkey Forest / Hanoman / Raya Ubud）是叫车红区</b>，Grab 不能在那些街上接客——住佩内斯塔南一般叫得到，稳妥还是让前台替你订。拼车巴士 Rp 100–150k/人，代价是得按它的班次走。<span class="en">① → ② Ubud to Seminyak (9/29): a one-way charter is Rp 350–600k; a Grab or Gojek car is Rp 150–250k, but central Ubud (Monkey Forest, Hanoman, Raya Ubud) is a no-pickup zone, so Grab cannot collect you on those streets. From Penestanan you can usually get one, but the safe bet is to have the front desk book it. Shared shuttle buses cost Rp 100–150k per person, but you travel on their timetable.</span><br/>' +
      '<b>出发窗口</b>　<b>13:00 前走最稳，14:30 是底线</b>。过了 15:00 再进城就是 2 小时起，因为末尾要穿过 Kerobokan。上午 08:00 走更快，但那样就浪费了乌布的最后一个上午。<span class="en">Departure window: leaving before 13:00 is safest and 14:30 is the limit. Start after 15:00 and it is two hours plus, because you finish by crossing Kerobokan. An 08:00 start is quicker but wastes your last Ubud morning.</span><br/>' +
      '<b>② → ③ 水明漾换乌干沙（10/1）</b>　Grab 汽车 Rp 150–250k（¥57–94）；想让司机中途停 GWK 或 Melasti 海滩，订半天包车 Rp 350–500k（¥132–189）更划算。<b>11:00 前后走</b>，别拖到 16:30 后（那是往南看日落的车流）。<span class="en">② → ③ Seminyak to Ungasan (10/1): a Grab car is Rp 150–250k; if you want the driver to stop at GWK or Melasti beach on the way, a half-day charter at Rp 350–500k is better value. Leave around 11:00 and do not drag it past 16:30, when the sunset traffic heads south.</span><br/>' +
      '<b>落地与返程</b>　机场 → ① 提前订接送 Rp 400–500k（¥151–189）；到达厅里的官方柜台也能叫，但 Rp 600–750k，<b>Grab / Gojek 被禁止在机场接客</b>，别指望落地现叫。23:00–06:00 落地，部分供应商加收 Rp 250k。返程 ③ → 机场 Grab 汽车约 Rp 130–200k（¥49–75）；早班机建议直接让酒店安排送机。<span class="en">Arrival and return: book the airport → ① transfer in advance for Rp 400–500k; the official counter in the arrivals hall also works but costs Rp 600–750k, and Grab or Gojek are banned from airport pick-ups, so do not count on hailing one on landing. Landings between 23:00 and 06:00 attract a Rp 250k surcharge with some operators. On the way back, ③ → airport by Grab car is about Rp 130–200k; for an early flight, have the hotel arrange it.</span><br/>' +
      '<b>顺路停靠</b>　①→② 途中可停 Tegenungan 瀑布、Batubulan 巴迪布村、Celuk 银器村；②→③ 途中可停 GWK 或 Melasti 海滩。包了车停靠不加钱，比专门跑一趟省事。<span class="en">Stops on the way: ①→② can take in Tegenungan waterfall, Batubulan batik village and Celuk silver village; ②→③ can stop at GWK or Melasti beach. Stops cost nothing extra once you have chartered the car, and it saves a separate trip.</span><br/>' +
      '<b>退房日</b>　行李直接放车上，别寄前台再折回来取；<b>提前一晚</b>跟前台确认车和出发时间。<span class="en">Check-out day: put your luggage straight into the car rather than leaving it at the desk and coming back for it, and confirm the car and departure time with the front desk the night before.</span><br/>' +
      '<b>两个固定堵点</b>　Kerobokan 路口 16:00–19:00；Mengwi 一带 13:00–14:00 学校放学（两段换店都会经过）。' + E("Two fixed bottlenecks, both on your transfer routes: the Kerobokan junction 16:00–19:00, and the Mengwi area 13:00–14:00 when the schools come out.") +

let picker = { level:"main", q:"" };
function openPicker(){
  const h = hubOf(state.hub);

function drawPicker(){
  const h = hubOf(state.hub);
  const q = picker.q.trim();
  let html = '<div class="crumb"><b>' + esc(h.n) + EI(EN_HUB[h.k] || "") + '</b>' +
    (state.dist ? '<i>›</i><b>' + esc(state.dist) + '</b>' : '') + '</div>' +
    '<div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.6" stroke="#877FA3" stroke-width="2"/><path d="M16 16l4.4 4.4" stroke="#877FA3" stroke-width="2" stroke-linecap="round"/></svg>' +
    '<input id="pq" placeholder="搜店名 / 区域 / 菜名（店名可打英文，如 Ibu Oka）" value="' + esc(picker.q) + '"></div>';

  if(q){
    const nq = q.toLowerCase();
    const hits = [];
    HUBS.forEach(function(x){ if(x.n.toLowerCase().indexOf(nq) >= 0) hits.push({t:"hub",k:x.k,n:x.n,sub:"落脚点 · " + x.note}); });
    Object.keys(AREA).forEach(function(a){ if(a.toLowerCase().indexOf(nq) >= 0 && hasShops(a)) hits.push({t:"area",n:a,sub:"区域"}); });
    DISHES.forEach(function(d, i){
      if((d.n + d.idn).toLowerCase().indexOf(nq) >= 0) hits.push({t:"dish",i:i,n:d.n,sub:"必吃 · " + d.idn});
      d.shops.forEach(function(s){
        if((s[0] + s[2]).toLowerCase().indexOf(nq) >= 0) hits.push({t:"shop",i:i,n:s[0],area:s[1],sub:s[1] + " · " + s[2]});
      });
    });
    // 去重：同类型的同名同区域只留一条
    const uniq = [], seen = {};
    hits.forEach(function(x){
      const k = x.t + "|" + x.n + "|" + (x.area || "");
      if(!seen[k]){ seen[k] = 1; uniq.push(x); }
    });
    window.__hits = uniq;
    html += '<div class="glabel">找到 ' + uniq.length + ' 条' + EI("results") + '</div>';
    html += uniq.length
      ? '<div class="grid two">' + uniq.slice(0, 40).map(function(x, i){
          return '<button class="gitem" data-hit="' + i + '">' + esc(x.n) + '<small>' + esc(x.sub) + '</small></button>';
        }).join("") + '</div>'
      : '<div class="empty" style="padding:30px 10px"><div class="sm">没搜到。试试店名的前几个字，或直接点上面的区域。' + E("Nothing found. Try the first few letters of a shop name, or pick an area above.") + '</div></div>';
    $("#shBody").innerHTML = html;
    return;
  }

  html += '<div class="glabel">把哪里设为圆心（你住哪一带）' + EI("pick your base") + '</div><div class="grid two">' +
    HUBS.map(function(x){
      return '<button class="gitem' + (state.hub===x.k?' on':'') + '" data-hub="' + x.k + '">' + esc(x.n) + EI(EN_HUB[x.k] || "") + '<small>' + esc(x.note) + EI(" · " + (EN_HUB_NOTE[x.k] || "")) + '</small></button>';
    }).join("") + '</div>';

  html += '<div class="glabel" style="margin-top:16px">只看某一个区域（可不选 · 只列已收录门店的片区）' + EI("filter by area") + '</div>';
  html += '<div class="hot"><button data-area=""' + (state.dist===""?' style="background:linear-gradient(135deg,#7C3AED,#8B5CF6);color:#fff"':'') + '>不限区域' + EI("All areas") + '</button></div>';
  AREA_GROUP.forEach(function(g){
    const list = g.list.filter(hasShops);
    if(!list.length) return;
    html += '<div class="glabel" style="margin-top:10px">' + esc(g.g) + EI(EN_GROUP[g.g] || "") + '</div><div class="grid">' +
      list.map(function(a){
        return '<button class="gitem' + (state.dist===a?' on':'') + '" data-area="' + esc(a) + '">' + esc(a) + EI(EN_AREA[a] || "") + '</button>';
      }).join("") + '</div>';
  });

  html += '<div class="glabel" style="margin-top:16px">用半径筛' + EI("by radius") + '</div><div class="grid two">' +
    RING_STEPS.map(function(r){
      return '<button class="gitem' + (state.ring===r.k?' on':'') + '" data-ring2="' + r.k + '">' + r.t + EI(EN_RING[r.k] || "") + '</button>';
    }).join("") + '</div>' +
    '<div class="tip" style="margin:12px 0 0">半径以「<b>' + esc(h.n) + '</b>」为中心，按各片区中心的<b>直线距离</b>筛选。想看全岛 10 道就选「不限」。<span class="en">The radius is measured from your base to each area centre in a straight line. Choose Any distance to see all 10 dishes across the island.</span></div>';

  $("#shBody").innerHTML = html;
}

/* ================= 弹层 ================= */
let sheetCtx = null;
function setSheet(title, sub, html, keep, titleEn, subEn){
  $("#shTitle").innerHTML = esc(title) + (titleEn ? EI(titleEn) : "");
  $("#shSub").innerHTML = esc(sub || "") + (subEn ? E(subEn) : "");
  if(!keep) $("#shBody").innerHTML = html || "";
}
function openSheet(){ $("#mask").classList.add("on"); $("#sheet").classList.add("on"); }
function closeSheet(){ $("#mask").classList.remove("on"); $("#sheet").classList.remove("on"); }

function toast(msg, en){
  const t = $("#toast");
  t.innerHTML = esc(msg) + (en ? EI(en) : ""); t.classList.add("on");
  clearTimeout(t.__tm);
  t.__tm = setTimeout(function(){ t.classList.remove("on"); }, 1900);
}
function copyText(s){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(function(){ toast("已复制", "Copied"); }, function(){ fallbackCopy(s); });
  } else fallbackCopy(s);
}
function fallbackCopy(s){
  const ta = document.createElement("textarea");
  ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("已复制", "Copied"); }catch(e){ toast("复制失败，请手动选择", "Copy failed — please select it manually"); }
  document.body.removeChild(ta);
}

/* ================= 导航 ================= */
function openNav(dishIdx, shopIdx){
  const d = DISHES[dishIdx];
  const s = d.shops[shopIdx];
  if(!d || !s) return;
  const nm = s[0], area = s[1], addr = s[2];
  const q = nm + " " + area + " Bali";
  const ll = areaLL(area);
  const coord = ll ? (ll[1].toFixed(5) + "," + ll[0].toFixed(5)) : "";
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  const opts = [
    {c:"#1A73E8", t:"Google 地图搜索", s:"按店名搜，看当前评分和最新评论（最准）", ten:"search", sen:"Search by name for the live rating and newest reviews — the most reliable route",
     u:"https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q)},
    {c:"#34A853", t:"Google 地图导航", s:"直接开始规划路线到这家店", ten:"directions", sen:"Plan a route to this shop",
     u:"https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(q)},
    {c:isIOS ? "#111827" : "#8B5CF6", t:"Apple 地图", s:"用系统地图打开", ten:"Apple Maps", sen:"Open in the system maps app",
     u:"https://maps.apple.com/?q=" + encodeURIComponent(q)},
    {c:"#8B5CF6", t:"复制店名 + 地址 + 坐标", s:"贴进 Grab / Gojek 里搜，或存进备忘录", ten:"copy", sen:"Paste into Grab / Gojek, or save it to your notes",
     u:"__copy"}
  ];

  const html =
    '<div class="shopcard">' +
      '<div class="r1">' + esc(nm) + '</div>' +
      '<div class="r2"><span>必吃：</span>' + esc(d.n) + '（' + esc(d.idn) + '）' + EI(EN_DISH[d.n] || "") + '<br/>' +
      '<span>区域：</span>' + esc(area) + EI(EN_AREA[area] || "") + '　<span>距' + esc(hubOf(state.hub).n) + '：</span>' + ringText(kmFromHub(area)) + '<br/>' +
      '<span>地址：</span>' + esc(addr) + (coord ? '<br/><span>坐标：</span>' + coord : "") +
      E((function(){ var e0 = EN_SHOP[d.n + "|" + nm] || {}; return [e0.a, e0.t].filter(Boolean).join(" · "); })()) + '</div>' +
      (s[3] ? '<div class="c-note" style="margin-top:9px">' + esc(s[3]) + E((EN_SHOP[d.n + "|" + nm] || {}).t || "") + '</div>' : "") +
    '</div>' +
    opts.map(function(o){
      return '<button class="nav-opt" data-navgo="' + encodeURIComponent(o.u) + '">' +
        '<span class="ni" style="background:' + o.c + '">' + esc(o.t.slice(0,1)) + '</span>' +
        '<span class="nt"><b>' + esc(o.t) + EI(o.ten) + '</b><small>' + esc(o.s) + E(o.sen) + '</small></span>' +
        '<span class="arw">›</span></button>';
    }).join("") +
    '<div class="mini" style="padding-top:12px">在巴厘岛，<b>Google 地图是唯一靠得住的地图</b><span class="en">In Bali, Google Maps is the only map you can rely on.</span><br/>' +
    '叫车用 Grab / Gojek，把店名复制进去即可<span class="en">For rides, use Grab or Gojek and paste the shop name in.</span><br/>' +
    '打开地图/叫车需联网，其余功能全程离线<span class="en">Opening maps or calling a car needs a connection; everything else works offline.</span></div>';

  setSheet("一键导航", d.n + " · " + area, html, false, "Directions", (EN_DISH[d.n] || "") + " · " + (EN_AREA[area] || area));
  sheetCtx = { nm:nm, area:area, addr:addr, coord:coord, dish:d.n };
  openSheet();
}

/* ================= 定位 ================= */
function doGeo(){
  const btn = $("#gpsBtn"), txt = $("#gpsTxt");
  if(!navigator.geolocation){ toast("这台设备不支持定位，请手动选择", "No location support on this device — pick a base manually"); openPicker(); return; }
  btn.classList.add("loading"); txt.innerHTML = "定位中" + EI("Locating");
  navigator.geolocation.getCurrentPosition(function(pos){
    btn.classList.remove("loading"); txt.innerHTML = "定位" + EI("Locate");
    const la = pos.coords.latitude, lo = pos.coords.longitude;
    let best = null, bd = 1e9;
    HUBS.forEach(function(x){
      const dd = haversine([la, lo], x.ll);
      if(dd < bd){ bd = dd; best = x; }
    });
    if(!best){ toast("没匹配到，请手动选择", "No match found — pick a base manually"); openPicker(); return; }
    state.hub = best.k; state.dist = ""; state.locMode = "gps";
    state.ring = bd <= 1 ? "walk" : (bd <= 5 ? "near" : (bd <= 15 ? "half" : "all"));
    save(); render();
    toast(bd > 100
      ? "看起来你还没到巴厘岛（最近的是 " + best.n + "，约 " + Math.round(bd) + " 公里），先按它给你列着"
      : "已定位到 " + best.n + (bd > 3 ? "（约 " + Math.round(bd) + " 公里）" : ""),
      bd > 100
      ? "Looks like you are not in Bali yet (nearest is " + (EN_HUB[best.k] || best.n) + ", about " + Math.round(bd) + " km) — listing it anyway"
      : "Located: " + (EN_HUB[best.k] || best.n) + (bd > 3 ? " (about " + Math.round(bd) + " km)" : ""));
  }, function(err){
    btn.classList.remove("loading"); txt.innerHTML = "定位" + EI("Locate");
    toast(err.code === 1 ? "定位权限被拒绝，请手动选择落脚点" : "定位失败，请手动选择落脚点", err.code === 1 ? "Location permission denied — pick a base manually" : "Location failed — pick a base manually");
    openPicker();
  }, {enableHighAccuracy:false, timeout:9000, maximumAge:300000});
}
function netStatus(){
  const d = $("#netDot"), t = $("#netTxt");
  if(!d) return;
  const on = navigator.onLine;
  d.className = "dot" + (on ? "" : " off");
  t.innerHTML = on ? "已联网" + EI("online") : "离线模式" + EI("offline");
}

/* ================= 语言切换 ================= */
function toggleLang(){
  state.lang = (state.lang === "bi") ? "zh" : "bi";
  save(); render();
  toast(state.lang === "bi" ? "已开启中英对照" : "已切回纯中文",
        state.lang === "bi" ? "Bilingual on" : "Chinese only");
}

/* ================= 事件 ================= */
document.addEventListener("click", function(e){
  const t = e.target.closest("[data-tab],[data-f],[data-ring],[data-ring2],[data-more],[data-favd],[data-favs],[data-nav],[data-del],[data-hub],[data-hubgo],[data-area],[data-hit],[data-navgo],[data-fx],[data-sw],[data-swpx],[data-goto],[data-favtop3],[data-jump],[id]");
  if(!t) return;
  const d = t.dataset;

  if(t.id === "locChip"){ openPicker(); return; }
  if(t.id === "langBtn"){ toggleLang(); return; }  if(t.id === "gpsBtn"){ doGeo(); return; }
  if(d.jump){ var jt = document.getElementById("jump-" + d.jump); if(jt){ jt.scrollIntoView({ behavior: "smooth", block: "start" }); } return; }
  if(d.tab){ state.tab = d.tab; state.expanded = {}; save(); closeSheet(); render(); return; }
  if(d.f){ state.flavor = d.f; renderChips(); render(); return; }
  if(d.ring){ state.ring = d.ring; save(); render(); return; }
  if(d.ring2){
    state.ring = d.ring2; save(); closeSheet(); render();
    toast(d.ring2 === "all" ? "已取消半径筛选" : "已按半径筛选", d.ring2 === "all" ? "Radius filter cleared" : "Filtered by radius");
    return;
  }
  if(d.goto !== undefined && d.goto !== ""){
    const gi = +d.goto;
    const dd = DISHES[gi]; if(!dd) return;
    state.mtab = "list";
    state.expanded[dd.n] = 1;
    render();
    setTimeout(function(){
      const card = document.getElementById("dish-" + gi);
      if(card){
        card.classList.add("hl");
        card.scrollIntoView({ behavior: "smooth", block: "start" });
        setTimeout(function(){ card.classList.remove("hl"); }, 2200);
      }
    }, 100);
    return;
  }
  if(d.sw){ setSwTab(d.sw, true); return; }
  if(d.swpx !== undefined){
    const i = SW_KEYS.indexOf(state.mtab);
    const n = Math.min(SW_KEYS.length - 1, Math.max(0, i + (+d.swpx)));
    if(n !== i) setSwTab(SW_KEYS[n], true);
    return;
  }
  if(d.favtop3 !== undefined){
    var top3 = currentList().slice(0, 3);
    var added = 0;
    top3.forEach(function(x){
      var dd = DISHES[x.base];
      if(!isFav(favKeyDish(dd))){
        state.favs.push({ k:favKeyDish(dd), t:"dish", n:dd.n,
          sub:"人均 " + idrText(dd.p) + " · " + dd.f.join("/"),
          en:(EN_DISH[dd.n] || "") + " · " + dd.f.map(function(f){ return EN_TAG[f] || f; }).join("/") + " · per person " + cnyText(dd.p) });
        added++;
      }
    });
    save(); render();
    toast(added ? "已收藏 TOP" + added : "TOP3 都已在清单里", added ? "Saved top " + added : "Top 3 already saved");
    return;
  }
  if(d.more){ state.expanded[d.more] = 1; render(); return; }
  if(d.favd){
    const i = +d.favd, dd = DISHES[i];
      toggleFav({ k:favKeyDish(dd), t:"dish", n:dd.n, sub:"人均 " + idrText(dd.p) + " · " + dd.f.join("/"),
        en:(EN_DISH[dd.n] || "") + " · " + dd.f.map(function(f){ return EN_TAG[f] || f; }).join("/") + " · per person " + cnyText(dd.p) });
    return;
  }
  if(d.favs){
    const p = d.favs.split(":"), i = +p[0], si = +p[1];
    const dd = DISHES[i], ss = dd.shops[si];
    toggleFav({ k:favKeyShop(dd.n, ss[0]), t:"shop", n:ss[0],
      sub:dd.n + " · " + ss[1] + " · " + ringText(kmFromHub(ss[1])),
      en:(EN_DISH[dd.n] || "") + " · " + (EN_AREA[ss[1]] || ss[1]) + " · " + ((EN_SHOP[dd.n + "|" + ss[0]] || {}).a || "") });
    return;
  }
  if(d.nav){ const p = d.nav.split(":"); openNav(+p[0], +p[1]); return; }
  if(d.del){
    const k = d.del;
    state.favs = state.favs.filter(function(f){ return f.k !== k; });
    save(); render(); toast("已移除", "Removed"); return;
  }
  if(d.hub){
    state.hub = d.hub; state.dist = ""; state.locMode = "manual";
    save(); closeSheet(); render(); toast("已设为 " + hubOf(d.hub).n, "Base set: " + (EN_HUB[d.hub] || hubOf(d.hub).n));
    return;
  }
  if(d.hubgo){
    state.hub = d.hubgo; state.dist = ""; state.locMode = "manual"; state.expanded = {};
    state.tab = "list";
    save(); closeSheet(); render();
    toast("已按「" + hubOf(d.hubgo).n + "」排榜", "Ranked around " + (EN_HUB[d.hubgo] || hubOf(d.hubgo).n));
    return;
  }
  if("area" in d){
    state.dist = d.area; state.locMode = "manual";
    save(); drawPicker(); render();
    toast(d.area ? ("只看 " + d.area) : "已不限区域", d.area ? ("Only " + (EN_AREA[d.area] || d.area)) : "All areas");
    return;
  }
  if(d.hit !== undefined){
    const x = (window.__hits || [])[+d.hit]; if(!x) return;
    if(x.t === "hub"){ state.hub = x.k; state.dist = ""; }
    else if(x.t === "area"){ state.dist = x.n; }
    else if(x.t === "dish"){ state.dist = ""; state.expanded[x.i] = 1; }
    else if(x.t === "shop"){ state.dist = x.area; state.expanded[x.i] = 1; }
    state.tab = "list";
    save(); closeSheet(); render();
    toast("已切到 " + (x.t === "hub" ? x.n : (x.area || x.n)), "Switched to " + (x.t === "hub" ? (EN_HUB[x.k] || x.n) : (EN_AREA[x.area || x.n] || x.area || x.n)));
    return;
  }
  if(d.navgo !== undefined){
    const u = decodeURIComponent(d.navgo);
    if(u === "__copy"){
      const c = sheetCtx;
      copyText(c.nm + "　" + c.area + "　" + c.addr + (c.coord ? "　坐标 " + c.coord : ""));
      return;
    }
    window.open(u, "_blank");
    return;
  }
  if(d.fx !== undefined){
    const v = +d.fx;
    const inp = $("#fxIn"); if(inp) inp.value = v;
    const out = $("#fxOut"); if(out) out.textContent = cnyText(v);
    return;
  }
});

document.addEventListener("input", function(e){
  const t = e.target;
  if(t && t.id === "pq"){ picker.q = t.value; drawPicker(); return; }
  if(t && t.id === "fxIn"){
    const v = parseFloat(String(t.value).replace(/[^0-9.]/g, ""));
    const out = $("#fxOut"); if(out) out.textContent = isFinite(v) && v > 0 ? cnyText(v) : "—";
    return;
  }
});

function on(sel, ev, fn){ const el = $(sel); if(el) el.addEventListener(ev, fn); return !!el; }

/* 注意：#mask 与 #sheet 是兄弟节点（非父子），所以点击弹层内部不会冒到遮罩，
   不需要在 #sheet 上 stopPropagation。
   反之若在 #sheet 上 stopPropagation，会把弹层内所有点击挡在 document 之外，
   导致「选落脚点 / 搜索结果 / 导航选项 / 换汇快捷键」全部点不动。 */
on("#mask", "click", closeSheet);
window.addEventListener("online", netStatus);
window.addEventListener("offline", netStatus);

/* ================= 启动 ================= */
/* 先渲染再挂事件：任何单个节点缺失都不该让整页空白 */
try{ load(); }catch(e){}
netStatus();
render();
// 回顶部按钮：滚动超过一屏才显示
window.addEventListener("scroll", function(){
  var tb = document.getElementById("totop");
  if(tb) tb.classList.toggle("show", window.scrollY > window.innerHeight);
}, { passive: true });
// 首次进入自动引导选落脚点
if(state.locMode === ""){
  setTimeout(function(){ openPicker(); }, 450);
}
</script>
