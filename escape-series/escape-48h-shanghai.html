<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1E9D9">
<title>48H ESCAPE · 上海出发</title>
<style>
/* ============================================================
   Design tokens — 8pt 间距 / 语义化色板 / WCAG AA 对比度
   ============================================================ */
:root{
  --bg:#F1E9D9;
  --card:#FFFCF4;
  --line:#E5DAC3;
  --line-2:#F0E8D8;

  --ink:#2A2317;      /* 16.8:1  AAA */
  --ink-2:#5F5745;    /*  7.0:1  AAA */
  --ink-3:#7A7059;    /*  4.7:1  AA  */
  --ink-4:#A79C86;    /* 仅用于图标与分隔线，不承载正文 */

  --pri:#2E6B57;
  --pri-dark:#22513F;
  --pri-tint:#E4EFE9;
  --rose:#B5502F;

  --tier1:#2E6B57; --tier1-bg:#E2EFE8;
  --tier2:#6E5A1C; --tier2-bg:#F3EDD8;
  --tier3:#8F4E1E; --tier3-bg:#F8EADC;
  --tier4:#9E3B2A; --tier4-bg:#F7E3DD;

  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:24px;
  --r-sm:10px; --r-md:13px; --r-lg:17px; --r-xl:22px;
  --sh:0 1px 2px rgba(76,58,30,.04), 0 6px 18px -8px rgba(76,58,30,.10);
  --sh-lift:0 2px 4px rgba(76,58,30,.05), 0 12px 28px -12px rgba(76,58,30,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:#DFD4BE;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:430px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;padding-bottom:calc(24px + env(safe-area-inset-bottom));box-shadow:0 0 70px rgba(70,52,28,.16);}
@media(max-width:430px){.wrap{box-shadow:none;}}

/* ===================== TOP BAR ===================== */
.top{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding:11px var(--sp4);display:flex;align-items:center;gap:var(--sp2);
}
.top .from{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;letter-spacing:-.01em;}
.top .dot{width:7px;height:7px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 3px rgba(46,107,87,.16);}
.top .mid{flex:1;text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.22em;color:var(--ink-4);}
.top .wish{
  display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;
  color:var(--ink-2);background:#F1E9D9;border:1px solid var(--line);
  padding:5px 11px;border-radius:999px;cursor:pointer;font-family:inherit;transition:.16s;min-height:30px;
}
.top .wish svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;}
.top .wish.on{background:var(--rose);border-color:var(--rose);color:#fff;}
.top .wish.on svg{fill:#fff;}

/* ===================== HERO ===================== */
.hero{
  margin:var(--sp4) var(--sp4) 0;padding:var(--sp5) var(--sp5) var(--sp4);border-radius:var(--r-xl);
  background:linear-gradient(158deg,#FFFCF4 0%,#F8F3E7 54%,#EDF5F0 100%);
  border:1px solid #E7DCC6;box-shadow:var(--sh);position:relative;overflow:hidden;
}
.hero::before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-92px;top:-112px;background:radial-gradient(circle,rgba(46,107,87,.12),rgba(46,107,87,0) 68%);pointer-events:none;}
.hero::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;left:-84px;bottom:-104px;background:radial-gradient(circle,rgba(46,107,87,.11),rgba(46,107,87,0) 68%);pointer-events:none;}
.hero>*{position:relative;z-index:1;}
.hero h1{margin:0 0 var(--sp5);font-size:26px;line-height:1.28;font-weight:800;letter-spacing:-.025em;color:#241E13;}
.hero h1 em{font-style:normal;color:var(--pri);background:linear-gradient(180deg,rgba(46,107,87,0) 62%,rgba(46,107,87,.15) 62%);border-radius:3px;padding:0 2px;}

.cd{background:var(--card);border:1px solid #E6DBC5;border-radius:var(--r-lg);padding:var(--sp4) var(--sp4) var(--sp3);box-shadow:0 1px 2px rgba(76,58,30,.04);}
.cd-label{font-size:11px;color:var(--ink-3);font-weight:600;margin-bottom:var(--sp3);}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp2);}
.cell{
  background:#F4EEDF;border-radius:var(--r-md);padding:var(--sp3) 0 var(--sp2);text-align:center;
  position:relative;overflow:hidden;perspective:340px;
}
.cell::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(76,58,30,.07);z-index:1;}
/* 每格底部的进度轨 = 这一档单位正在走的进度（天:24h / 小时:1h / 分钟:1min 走满） */
.cell .prog{
  position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--pri);z-index:2;
  transform-origin:0 50%;transform:scaleX(0);border-radius:0 99px 99px 0;
  transition:transform .98s linear;
}
.cell b{
  display:block;font-size:27px;font-weight:800;line-height:1.05;color:#241E13;
  font-variant-numeric:tabular-nums;letter-spacing:-.04em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;transform-origin:50% 100%;
}
.cell span{display:block;font-size:10px;color:var(--ink-3);margin-top:3px;}
.cd-foot{display:flex;align-items:center;gap:6px;margin-top:var(--sp3);font-size:11px;color:var(--ink-3);}
.cd-foot i{width:6px;height:6px;border-radius:50%;background:#3E8467;flex:0 0 6px;animation:breathe 2s ease-in-out infinite;}

/* ===================== SECTION ===================== */
.sec{padding:0 var(--sp4);}
.sec-t{display:flex;align-items:center;gap:var(--sp2);margin:var(--sp6) 2px var(--sp3);}
.sec-t i{width:3px;height:14px;border-radius:2px;background:var(--pri);display:block;flex:0 0 3px;}
.sec-t b{font-size:15px;font-weight:800;letter-spacing:-.02em;}
.sec-t span{font-size:10.5px;color:var(--ink-3);margin-left:auto;font-weight:600;}

/* ---------- 本周推荐 ---------- */
.picks{display:flex;gap:9px;overflow-x:auto;padding:2px var(--sp4) 4px;margin:0 calc(var(--sp4) * -1);scrollbar-width:none;}
.picks::-webkit-scrollbar{display:none;}
.pcard{
  flex:0 0 182px;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:0;cursor:pointer;font-family:inherit;color:inherit;
  transition:.16s;box-shadow:var(--sh);overflow:hidden;
}
.pcard:active{transform:scale(.98);}
.pcard .cover{height:80px;flex:0 0 80px;position:relative;overflow:hidden;background:#EFE7D6;}
.pcard .cover img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.3);transition:transform .5s cubic-bezier(.22,.9,.3,1);}
.pcard:active .cover img{transform:scale(1.22);}
.pcard .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(48,36,18,.36),rgba(48,36,18,0) 54%,rgba(48,36,18,.2));}
.pcard .in{padding:var(--sp3);flex:1;}
.pnum{position:absolute;left:9px;top:7px;z-index:1;font-size:10px;font-weight:800;color:#fff;letter-spacing:.08em;font-variant-numeric:tabular-nums;text-shadow:0 1px 5px rgba(0,0,0,.6);}
.pdur{position:absolute;right:8px;top:7px;z-index:1;font-size:9.5px;font-weight:800;color:#221C12;background:rgba(255,255,255,.95);border-radius:999px;padding:2.5px 7px;font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(0,0,0,.22);}
.pcard b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px;}
.pwhy{display:block;font-size:11.5px;color:var(--ink-2);line-height:1.5;}

/* ---------- 主 CTA ---------- */
.lucky{
  width:100%;margin-top:var(--sp4);padding:15px;border-radius:var(--r-lg);cursor:pointer;
  border:none;font-family:inherit;color:#fff;font-size:13.5px;font-weight:800;
  background:linear-gradient(135deg,#3E7A63,#B5642A 55%,#2E6B57);
  box-shadow:0 8px 22px -10px rgba(46,107,87,.85);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:.16s;min-height:50px;
}
.lucky:active{transform:scale(.985);}
.lucky small{font-size:10px;font-weight:500;opacity:.85;}

/* ---------- 时长圈层尺 ---------- */
.ruler{margin:0 2px var(--sp3);}
.rcap{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:var(--sp2);}
.rcap span{font-size:10.5px;color:var(--ink-3);}
.rcap em{font-style:normal;font-size:10px;color:var(--ink-4);white-space:nowrap;}
.rbar{display:flex;gap:5px;height:50px;}
.rseg{
  border:1.5px solid transparent;font-family:inherit;cursor:pointer;border-radius:var(--r-md);
  padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;transition:.2s;min-width:0;overflow:hidden;
}
.rseg b{font-size:11.5px;font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;}
.rseg span{font-size:10px;font-weight:600;line-height:1.15;white-space:nowrap;opacity:.9;}
.rseg:active{transform:scale(.97);}
.rseg.off{background:#EFE7D6;color:#9A8F78;border-color:transparent;}
.rseg.on.b1{background:var(--tier1-bg);color:var(--tier1);border-color:var(--tier1);}
.rseg.on.b2{background:var(--tier2-bg);color:var(--tier2);border-color:var(--tier2);}
.rseg.on.b3{background:var(--tier3-bg);color:var(--tier3);border-color:var(--tier3);}
.rseg.on.b4{background:var(--tier4-bg);color:var(--tier4);border-color:var(--tier4);}
.rstat{margin-top:var(--sp3);font-size:11px;color:var(--ink-2);font-weight:600;}
.rstat b{color:var(--pri);font-weight:800;font-size:12.5px;}

/* ---------- 主题 chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px var(--sp4) 3px;margin:0 calc(var(--sp4) * -1) var(--sp4);scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chips button{
  flex:0 0 auto;font-family:inherit;cursor:pointer;transition:.16s;min-height:32px;
  background:var(--card);border:1px solid var(--line);color:var(--ink-2);
  font-size:11.5px;font-weight:600;padding:6px 13px;border-radius:999px;white-space:nowrap;
}
.chips button.on{background:#2A2317;border-color:#2A2317;color:#fff;font-weight:700;}

/* ---------- 城市列表 ---------- */
.list{display:flex;flex-direction:column;gap:9px;}
.row{
  display:flex;align-items:center;gap:var(--sp3);width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--sp3);cursor:pointer;font-family:inherit;color:inherit;transition:.16s;box-shadow:var(--sh);
}
.row:active{transform:scale(.982);border-color:#D3C7AF;}
/* 缩略图 = 该城的纸艺分层插画 */
.thumb{
  width:88px;height:88px;flex:0 0 88px;border-radius:14px;overflow:hidden;
  position:relative;background:#EFE7D6;
  box-shadow:0 5px 16px -7px rgba(76,58,30,.45), inset 0 0 0 1px rgba(46,36,20,.07);
}
.thumb img{
  width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.32);                      /* 把纸底留白推出可视区，聚焦主体 */
  transition:transform .5s cubic-bezier(.22,.9,.3,1);
}
.row:active .thumb img{transform:scale(1.4);}
.rmain{flex:1;min-width:0;}
.rtop{display:flex;align-items:center;gap:7px;}
.rtop b{font-size:16px;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dur{flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--pri);background:var(--pri-tint);border-radius:999px;padding:2.5px 8px;font-variant-numeric:tabular-nums;}
.rsub{font-size:10.5px;color:var(--ink-3);margin-top:3px;}
.rhook{font-size:11.5px;color:var(--ink-2);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.rmeta{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;}
.rmeta span{font-size:10px;color:var(--ink-3);background:#F3EDDE;border-radius:6px;padding:2.5px 7px;font-weight:600;}
.rmeta span.money{background:#F8EBDB;color:#8F4E1E;font-weight:800;}
.rmeta span.warn{background:#F9E5DF;color:#9E3B2A;}
.heart{
  flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:none;background:#F3EDDE;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.16s;padding:0;
}
.heart svg{width:16px;height:16px;fill:none;stroke:#8A7F69;stroke-width:2;transition:.16s;}
.heart.on{background:#F8E7DF;}
.heart.on svg{fill:var(--rose);stroke:var(--rose);}
.heart:active{transform:scale(.88);}

.empty{text-align:center;padding:36px var(--sp5);color:var(--ink-3);font-size:12.5px;background:var(--card);border:1px dashed #DCD0B9;border-radius:var(--r-lg);}
.empty b{display:block;font-size:14px;color:var(--ink-2);margin-bottom:5px;font-weight:700;}

/* ---------- 检查清单 ---------- */
.check{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp4) var(--sp4) 6px;box-shadow:var(--sh);}
.cprog{display:flex;align-items:center;gap:var(--sp2);margin-bottom:var(--sp1);}
.cprog .pbar{flex:1;height:5px;border-radius:99px;background:#EFE7D6;overflow:hidden;}
.cprog .pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#3E7A63,#2E6B57);transition:width .3s;}
.cprog b{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:700;}
.check label{display:flex;gap:11px;align-items:flex-start;padding:11px 0;cursor:pointer;border-bottom:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);line-height:1.55;}
.check label:last-child{border-bottom:none;padding-bottom:8px;}
.check input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:0 0 20px;margin-top:1px;border:2px solid #C9BDA4;border-radius:50%;cursor:pointer;position:relative;transition:.16s;}
.check input:checked{background:var(--pri);border-color:var(--pri);}
.check input:checked::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.check label.done span{color:var(--ink-3);text-decoration:line-through;}
.check b{color:var(--ink);font-weight:700;}

.foot-note{font-size:10.5px;color:var(--ink-3);line-height:1.7;text-align:center;padding:var(--sp5) 10px 4px;}
.foot-note b{color:var(--ink-2);}

/* ===================== DETAIL PAGE ===================== */
.page{
  position:fixed;inset:0;z-index:60;max-width:430px;margin:0 auto;background:var(--bg);
  transform:translateX(101%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(58,44,22,.18);
}
.page.on{transform:translateX(0);}
.phero{flex:0 0 auto;min-height:200px;padding:var(--sp4) var(--sp5) var(--sp5);color:#fff;border-radius:0 0 var(--r-xl) var(--r-xl);position:relative;overflow:hidden;background:#3A3221;}
/* 该城纸艺插画铺满头图，再压一层深色渐变保证白字可读（WCAG AA） */
.pbg{position:absolute;inset:0 -9%;z-index:0;}   /* 左右外扩 9%：cover 会据此放大，把插画自带的米色纸边（最大 5.8%）推出可视区 */
.pbg img{width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block;}
.phero::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(46,34,16,.46) 0%,rgba(46,34,16,.18) 40%,rgba(46,34,16,.70) 100%);
}
.phero > .ptop2,.phero > .pdir,.phero > h2,.phero > .ppills{position:relative;z-index:2;}
.ptop2{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.pbtn{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.22);color:#fff;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:.16s;padding:0;}
.pbtn:active{transform:scale(.9);}
.pbtn svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.2;}
.pbtn.on{background:rgba(255,255,255,.96);}
.pbtn.on svg{fill:#fff;stroke:var(--rose);}
.pdir{font-size:11px;opacity:.86;margin:var(--sp3) 0 4px;position:relative;z-index:1;}
.phero h2{margin:0;font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.2;position:relative;z-index:1;}
.ppills{display:flex;gap:6px;margin-top:var(--sp3);flex-wrap:wrap;position:relative;z-index:1;}
.ppills span{font-size:10.5px;background:rgba(255,255,255,.24);border-radius:7px;padding:4px 9px;font-weight:600;}
.ppills span.k{background:var(--card);color:#2A2317;font-weight:800;}

.pbody{flex:1;overflow-y:auto;padding:var(--sp4) var(--sp4) calc(var(--sp6) + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:var(--sp3);}
.pgrid .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;box-shadow:var(--sh);}
.pgrid .box.full{grid-column:1/-1;}
.pgrid dt{font-size:10px;color:var(--ink-3);margin-bottom:4px;font-weight:600;}
.pgrid dd{margin:0;font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.35;letter-spacing:-.01em;}
.pgrid dd small{display:block;font-weight:500;color:var(--ink-2);font-size:10.5px;margin-top:2px;letter-spacing:0;}

.quote2{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp3) 14px;font-size:12.5px;color:var(--ink-2);line-height:1.65;box-shadow:var(--sh);}
.quote2 b{color:var(--pri);}

.pblk{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink-3);margin:var(--sp5) 0 11px;}
.tl-row{display:flex;gap:10px;padding-bottom:11px;}
.tl-side{flex:0 0 52px;text-align:right;padding-top:12px;}
.tl-side b{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink);}
.tl-side span{display:block;font-size:9.5px;color:var(--ink-3);margin-top:2px;line-height:1.3;}
.tl-main{flex:1;position:relative;padding-left:14px;}
.tl-main::before{content:"";position:absolute;left:0;top:20px;bottom:-11px;width:2px;background:linear-gradient(180deg,#DCD0BA,#EFE8D8);}
.tl-row:last-child .tl-main::before{display:none;}
.tl-main::after{content:"";position:absolute;left:-3px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 3px var(--pri-tint);}
.tl-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;box-shadow:var(--sh);}
.tl-item{display:flex;gap:9px;padding:4px 0;}
.tl-item em{font-style:normal;flex:0 0 auto;min-width:38px;font-size:11px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums;padding-top:1.5px;}
.tl-item span{flex:1;font-size:12.5px;color:var(--ink-2);line-height:1.55;}

.kv2{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp3) 14px;margin-bottom:9px;box-shadow:var(--sh);}
.kv2 h4{margin:0 0 7px;font-size:12px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;}
.kv2 h4 i{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;background:var(--pri-tint);}
.kv2 p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.7;}
.kv2 ul{margin:0;padding:0;list-style:none;}
.kv2 li{font-size:12.5px;color:var(--ink-2);line-height:1.7;padding-left:15px;position:relative;margin-bottom:4px;}
.kv2 li:last-child{margin-bottom:0;}

/* ============================================================

   ============================================================ */
@keyframes breathe{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.6);opacity:.45;}}
@keyframes flipIn{0%{transform:rotateX(-88deg);opacity:.12;}58%{transform:rotateX(13deg);opacity:1;}100%{transform:rotateX(0);opacity:1;}}
@keyframes rise{from{opacity:0;transform:translateY(11px);}to{opacity:1;transform:translateY(0);}}

}

var band="2.5h", theme="all", onlyWish=false, curId=null, wish=[];
try{ wish = JSON.parse(localStorage.getItem("escape.wish")||"[]"); }catch(e){ wish=[]; }

function $(id){ return document.getElementById(id); }
function byId(id){ return SPOTS.filter(function(s){ return s.id===id; })[0]; }
function saveWish(){ try{ localStorage.setItem("escape.wish", JSON.stringify(wish)); }catch(e){} }

/* 班次密度 → 可执行结论 */
function tripLevel(t){
  var n = parseInt(t,10) || 0;
  if(n>=60) return {lab:"班次很密 · 说走就走", warn:false};
  if(n>=20) return {lab:"班次够用 · 提前一天订", warn:false};
  return {lab:"班次少 · 务必提前订票", warn:true};
}

/* ---------------- 倒计时：只到分钟，周五当天切换文案 ---------------- */
function nextFri(){
  var now=new Date(), d=new Date(now);
  d.setDate(d.getDate() + ((5-d.getDay()+7)%7));
  d.setHours(18,0,0,0);
  if(d.getTime()<=now.getTime()) d.setDate(d.getDate()+7);
  return d;
}
function pad(n){ return n<10 ? "0"+n : String(n); }

/* 数字翻牌：只在值真的变化时翻，首帧从「--」进来不翻 */
function putNum(el, val){
  var old = el.textContent;
  el.textContent = val;
  if(old === val || old === "--") return;
  el.classList.remove("flip");
  void el.offsetWidth;              /* 强制重排，让动画能重播 */
  el.classList.add("flip");
}
/* 进度轨：这一格的数字「还剩多少路程才跳变」，走满即跳 */
function putProg(el, ratio){
  if(!el) return;
  el.style.transform = "scaleX(" + Math.max(0, Math.min(1, ratio)).toFixed(4) + ")";
}

function tick(){
  var now = new Date();
  var target = nextFri();
  var t = Math.max(0, Math.floor((target-now)/1000));
  var dd = Math.floor(t/86400);
  var hh = Math.floor(t%86400/3600);
  var mm = Math.floor(t%3600/60);
  var ss = now.getSeconds();
  var isFri = now.getDay()===5 && now.getHours()<18;

  var unit = $("cells").querySelectorAll(".cell");
  var nums = $("cells").querySelectorAll(".cell b");
  var sp   = $("cells").querySelectorAll(".cell span");
  /* 各格「本单位已经走完的比例」：天 24h 走满 / 小时 1h / 分钟 1min */
  var remD = (hh*3600 + mm*60 + ss) / 86400;
  var remH = (mm*60 + ss) / 3600;
  var remM = ss / 60;

  if(isFri){
    putNum(nums[0], pad(hh));
    putNum(nums[1], pad(mm));
    sp[0].textContent = "小时";
    sp[1].textContent = "分钟后下班";
    unit[2].style.display = "none";
    $("cells").style.gridTemplateColumns = "1fr 1fr";
    $("cdLabel").textContent = "今天就是周五，收拾包就能跑";
    $("cdFoot").textContent = "18:00 从上海出发 · 别加班";
    putProg(unit[0].querySelector(".prog"), 1 - remH);
    putProg(unit[1].querySelector(".prog"), 1 - remM);
  }else{
    unit[2].style.display = "";
    $("cells").style.gridTemplateColumns = "repeat(3,1fr)";
    sp[0].textContent = "天"; sp[1].textContent = "小时"; sp[2].textContent = "分钟";
    putNum(nums[0], String(dd));
    putNum(nums[1], pad(hh));
    putNum(nums[2], pad(mm));
    $("cdLabel").textContent = "距下一次发车";
    $("cdFoot").textContent = "本周五 18:00 · 从上海出发";
    putProg(unit[0].querySelector(".prog"), 1 - remD);
    putProg(unit[1].querySelector(".prog"), 1 - remH);
    putProg(unit[2].querySelector(".prog"), 1 - remM);
  }
}

/* ---------------- 本周推荐 ---------------- */
function renderPicks(){
  var m = new Date().getMonth()+1;
  var list = MONTH_PICKS[m] || MONTH_PICKS[9];
  $("monthTag").textContent = m + " 月";
  $("picks").innerHTML = list.map(function(p,i){
    var s = byId(p[0]); if(!s) return "";
    return '<button class="pcard" data-id="'+s.id+'" style="animation-delay:'+(i*70)+'ms">'+
      '<div class="cover"><img src="'+CITY_IMG[s.id]+'" alt="">'+
        '<span class="pnum">0'+(i+1)+'</span><span class="pdur">'+s.dur+'</span></div>'+
      '<div class="in">'+
        '<b>'+s.name+'</b>'+
        '<span class="pwhy">'+p[1]+'</span>'+
      '</div></button>';
  }).join("");
  $("picks").querySelectorAll(".pcard").forEach(function(c){
    c.onclick = function(){ openPage(c.dataset.id); };
  });
}

/* ---------------- 圈层尺 ---------------- */
function renderRuler(){
  var sel = RANK[band], total = 0;
  $("rbar").innerHTML = BANDS.map(function(b,i){
    var n = SPOTS.filter(function(s){ return s.band===b.k; }).length;
    var on = i <= sel;
    if(on) total += n;
    return '<button class="rseg '+(on ? "on "+b.cls : "off")+'" style="flex:'+b.fl+'" data-k="'+b.k+'">'+
             '<b>'+b.up+'</b><span>'+n+' 座</span></button>';
  }).join("");
  $("rbar").querySelectorAll(".rseg").forEach(function(btn){
    btn.onclick = function(){ band=btn.dataset.k; renderRuler(); renderList(); };
  });
  $("rstat").innerHTML = (band==="2.5h")
    ? '亮起的色块＝已包含的圈层 · 共 <b>'+total+'</b> 座城'
    : '已选 <b>'+band+'</b> 以内 · 共 <b>'+total+'</b> 座城可逃';
}

/* ---------------- 主题 ---------------- */
function renderChips(){
  $("chips").innerHTML = THEMES.map(function(t){
    return '<button data-k="'+t.k+'" class="'+(t.k===theme?"on":"")+'">'+t.label+'</button>';
  }).join("");
  $("chips").querySelectorAll("button").forEach(function(btn){
    btn.onclick=function(){ theme=btn.dataset.k; renderChips(); renderList(); };
  });
}

/* ---------------- 列表 ---------------- */
function pool(){
  var max = RANK[band];
  var th = THEMES.filter(function(x){ return x.k===theme; })[0];
  return SPOTS.filter(function(s){
    if(RANK[s.band] > max) return false;
    if(!th.t(s)) return false;
    if(onlyWish && wish.indexOf(s.id)<0) return false;
    return true;
  });
}
function renderList(){
  var list = pool();
  $("cnt").textContent = list.length + " 条路线";
  if(!list.length){
    $("list").innerHTML = '<div class="empty"><b>这个条件下暂时没有路线</b>换个时长档或主题试试'+(onlyWish?"，或者先点几个 ♡ 收藏":"")+'</div>';
    return;
  }
  $("list").innerHTML = list.map(function(s,i){
    var lv = tripLevel(s.trips);
    return '<button class="row" data-id="'+s.id+'" style="animation-delay:'+(i*26)+'ms">'+
      '<div class="thumb"><img src="'+CITY_IMG[s.id]+'" alt=""></div>'+
      '<div class="rmain">'+
        '<div class="rtop"><b>'+s.name+'</b><span class="dur">'+s.dur+'</span></div>'+
        '<div class="rsub">'+s.dir+' · '+s.from+'</div>'+
        '<div class="rhook">'+s.hook+'</div>'+
        '<div class="rmeta">'+
          '<span class="money">人均 '+s.budget+'</span>'+
          '<span class="'+(lv.warn?"warn":"")+'">'+s.trips+'</span>'+
          '<span>'+s.tags.join(" · ")+'</span>'+
        '</div>'+
      '</div>'+
      '<div class="heart '+(wish.indexOf(s.id)>-1?"on":"")+'" data-h="'+s.id+'">'+
        '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9a4 4 0 017-2.6A4 4 0 0119 11c0 4.6-7 9-7 9z"/></svg>'+
      '</div>'+
    '</button>';
  }).join("");
  $("list").querySelectorAll(".row").forEach(function(r){
    r.onclick = function(e){
      if(e.target.closest(".heart")) return;
      openPage(r.dataset.id);
    };
  });
  $("list").querySelectorAll(".heart").forEach(function(h){
    h.onclick = function(e){ e.stopPropagation(); toggleWish(h.dataset.h); };
  });
}

function toggleWish(id){
  var i = wish.indexOf(id);
  if(i>-1) wish.splice(i,1); else wish.push(id);
  saveWish(); syncWish(); renderList();
}
function syncWish(){
  $("wishN").textContent = wish.length;
  $("wishBtn").classList.toggle("on", onlyWish);
  if(curId) $("pHeart").classList.toggle("on", wish.indexOf(curId)>-1);
}
$("wishBtn").onclick = function(){
  onlyWish = !onlyWish;
  syncWish(); renderList();
  window.scrollTo({top: $("rbar").offsetTop - 110, behavior:"smooth"});
};

/* ---------------- 清单 ---------------- */
function renderCheck(){
  var html = '<div class="cprog"><div class="pbar"><i id="pbar"></i></div><b id="cpct">0/5</b></div>';
  html += CHECK.map(function(t,i){
    return '<label><input type="checkbox" data-i="'+i+'"><span>'+t+'</span></label>';
  }).join("");
  $("check").innerHTML = html;
  $("check").querySelectorAll("input").forEach(function(inp){
    inp.onchange = function(){
      inp.closest("label").classList.toggle("done", inp.checked);
      var done = $("check").querySelectorAll("input:checked").length;
      $("cpct").textContent = done+"/5";
      $("cCnt").textContent = done+"/5";
      $("pbar").style.width = (done/5*100)+"%";
    };
  });
}

/* ---------------- 详情页 ---------------- */
function planText(s){
  var L = [];
  L.push("【"+s.name+" · 48 小时逃离计划】");
  L.push("从上海出发 · 高铁 "+s.dur+" · "+s.trips);
  L.push("上车点："+s.from);
  L.push("人均："+s.budget+" ｜ 住："+s.stay+"（"+s.stayP+"/晚）");
  L.push("");
  s.plan.forEach(function(b){
    L.push("— "+b.d+" · "+b.s+" —");
    b.it.forEach(function(it){ L.push(it[0]+" "+it[1]); });
    L.push("");
  });
  L.push("吃什么："+s.eat);
  if(s.hotel){
    L.push("住哪（华住会全季）：");
    L.push("· "+s.hotel.n+"｜"+s.hotel.a+"（参考 "+s.hotel.p+"/晚）");
    if(s.hotel.alt) L.push("· 备选："+s.hotel.alt.n+"｜"+s.hotel.alt.a);
  }
  L.push("注意：");
  s.tip.forEach(function(t){ L.push("· "+t.replace(/<[^>]+>/g,"")); });
  return L.join("\n");
}
var toastTimer = null;
function showToast(msg){
  var el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("on"); }, 2200);
}
function copyPlan(s){
  var text = planText(s);
  var ok = function(){ showToast("行程已复制，去粘到备忘录 / 发同行的人"); };
  var fail = function(){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;left:-9999px;top:0;";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); ok(); }
    catch(e){ showToast("复制失败，请长按文字自行复制"); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, fail);
  }else{ fail(); }
}

/* 住宿推荐卡：华住会全季。有备选门店就多渲染一段 */
function hotelBlock(s){
  var h = s.hotel; if(!h) return "";
  var alt = "";
  if(h.alt){
    alt = '<div class="h-alt">'+
      '<div class="h-hd"><span class="badge alt">备选</span><span class="h-nm">'+h.alt.n+'</span></div>'+
      '<p class="h-addr">'+h.alt.a+'</p>'+
      '<p class="h-why">'+h.alt.w+'</p>'+
    '</div>';
  }
  return '<div class="hotel">'+
      '<div class="h-hd"><span class="badge">全季</span><span class="h-nm">'+h.n+'</span></div>'+
      '<p class="h-addr">'+h.a+'</p>'+
      '<p class="h-why">'+h.w+'</p>'+
      '<span class="h-price">参考 '+h.p+' / 晚</span>'+
      alt+
      '<p class="h-note">全季属华住会旗下，会员价与积分通用；房价随日期浮动，下单请以「华住会」App 实时报价为准。</p>'+
    '</div>';
}

var heroGuard = null;   /* 头图解码完成前不滑入面板，避免露出兜底色 #3A3221 */
function revealPage(){
  if(heroGuard === null) return;
  clearTimeout(heroGuard); heroGuard = null;
  $("page").classList.add("on");
}
function holdPageForHero(){
  var img = $("pBgImg");
  heroGuard = 0;
  var ping = function(){ revealPage(); };
  if(img && img.decode){
    heroGuard = setTimeout(ping, 240);       /* 兜底：解码异常也不能卡住滑入 */
    img.decode().then(ping, ping);
  } else { ping(); }
}
function openPage(id){
  var s = byId(id); if(!s) return;
  curId = id;
  var bgImg = $("pBgImg");                    /* 复用同一 <img>：只换 src，不重建元素 */
  if(bgImg.getAttribute("src") !== CITY_IMG[id]) bgImg.setAttribute("src", CITY_IMG[id]);
  $("pDir").textContent = s.dir + " · 上海出发";
  $("pName").textContent = s.name;
  $("pPills").innerHTML = '<span class="k">'+s.dur+' 直达</span><span>'+s.trips+'</span>'+
    s.tags.map(function(t){ return '<span>'+t+'</span>'; }).join("");
  $("pHeart").classList.toggle("on", wish.indexOf(id)>-1);

  var lv = tripLevel(s.trips);
  var tl = s.plan.map(function(b){
    return '<div class="tl-row">'+
      '<div class="tl-side"><b>'+b.d+'</b><span>'+b.s+'</span></div>'+
      '<div class="tl-main"><div class="tl-card">'+
        b.it.map(function(it){ return '<div class="tl-item"><em>'+it[0]+'</em><span>'+it[1]+'</span></div>'; }).join("")+
      '</div></div></div>';
  }).join("");

  $("pBody").innerHTML =
    '<div class="pgrid">'+
      '<div class="box"><dt>高铁时长</dt><dd>'+s.dur+'<small>'+s.from+'</small></dd></div>'+
      '<div class="box"><dt>人均预算</dt><dd>'+s.budget+'<small>含往返高铁</small></dd></div>'+
      '<div class="box full"><dt>票好不好买</dt><dd>'+s.trips+'<small>'+lv.lab+'</small></dd></div>'+
      '<div class="box full"><dt>建议住在哪一片</dt><dd>'+s.stay+'<small>'+s.stayP+' / 晚</small></dd></div>'+
    '</div>'+
    '<div class="quote2"><b>「</b>'+s.hook+'<b>」</b></div>'+
    '<div class="pblk">48 小时行程</div>'+
    '<div class="tl">'+tl+'</div>'+
    '<div class="pblk">实用信息</div>'+
    '<div class="kv2"><h4><i>🍜</i>吃什么</h4><p>'+s.eat+'</p></div>'+
    '<div class="kv2"><h4><i>⚠️</i>避坑两句</h4><ul>'+s.tip.map(function(t){ return '<li>'+t+'</li>'; }).join("")+'</ul></div>'+
    '<div class="pblk">住哪 · 华住会全季</div>'+
    hotelBlock(s)+
    '<button class="copy" id="copyBtn">复制这份行程（可直接发给同行的人）</button>';

  $("pBody").scrollTop = 0;
  var kids = $("pBody").children;               /* 行程内容逐块浮入，不是"啪"一下全出来 */
  for(var k=0;k<kids.length;k++) kids[k].style.animationDelay = (k*52)+"ms";
  holdPageForHero();
  document.body.style.overflow = "hidden";
  var cb = $("copyBtn");
  if(cb) cb.onclick = function(){
    copyPlan(s);
    cb.classList.add("done");
    cb.textContent = "已复制到剪贴板 ✓";
    setTimeout(function(){ cb.classList.remove("done"); cb.textContent = "复制这份行程（可直接发给同行的人）"; }, 2200);
  };
}
function closePage(){
  if(heroGuard !== null){ clearTimeout(heroGuard); heroGuard = null; }
  $("page").classList.remove("on");
  document.body.style.overflow = "";
}
$("pBack").onclick = closePage;
$("pHeart").onclick = function(){ if(curId) toggleWish(curId); };
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closePage(); });

/* ---------------- 其他 ---------------- */
$("lucky").onclick = function(){
  var p = pool();
  var list = p.length ? p : SPOTS;
  openPage(list[Math.floor(Math.random()*list.length)].id);
};
renderPicks(); renderRuler(); renderChips(); renderList(); renderCheck(); syncWish(); tick();
setInterval(tick, 1000);   /* 每秒一拍：分钟进度轨要动，数值变了才翻牌 */
